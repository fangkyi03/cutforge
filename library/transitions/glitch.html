<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
.g{position:absolute;left:0;right:0;mix-blend-mode:screen}
</style>
</head>
<body>
<div class="g" id="g0"></div><div class="g" id="g1"></div><div class="g" id="g2"></div><div class="g" id="g3"></div><div class="g" id="g4"></div><div class="g" id="g5"></div><div class="g" id="g6"></div><div class="g" id="g7"></div>
<script type="module">
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => 1 - Math.pow(1 - clamp01(x), 3);
const easeInOut = (x) => { x = clamp01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const D = 0.5;
const gs = [...document.querySelectorAll('.g')]; const seq = [0.13,0.71,0.42,0.88,0.27,0.55,0.95,0.06,0.64,0.33,0.79,0.18]; function frame(t) { const n = Math.floor(t * 30); const on = Math.sin(Math.PI * t / D); gs.forEach((g, i) => { const r = seq[(n + i * 5) % seq.length]; g.style.top = (r * 100) + '%'; g.style.height = (2 + seq[(n + i) % seq.length] * 8) + '%'; g.style.background = i % 2 ? '#19f5e1' : '#ff3df2'; g.style.opacity = on * (r > 0.3 ? 0.8 : 0); g.style.transform = `translateX(${(r - 0.5) * 40}px)`; }); }
window.film = { duration: D, frame };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { frame(((performance.now() - t0) / 1000) % D); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
