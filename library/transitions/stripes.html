<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
.s{position:absolute;top:0;bottom:0;width:20%;background:#111}
</style>
</head>
<body>
<div class="s" style="left:0%"></div><div class="s" style="left:20%"></div><div class="s" style="left:40%"></div><div class="s" style="left:60%"></div><div class="s" style="left:80%"></div>
<script type="module">
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => 1 - Math.pow(1 - clamp01(x), 3);
const easeInOut = (x) => { x = clamp01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const D = 0.9;
const ss = [...document.querySelectorAll('.s')]; function frame(t) { ss.forEach((s, i) => { const k = (t - i * 0.06) / (D - 0.24); const v = k < 0.5 ? easeInOut(k * 2) : 1 - easeInOut((k - 0.5) * 2); s.style.transform = `scaleY(${clamp01(v)})`; s.style.transformOrigin = i % 2 ? 'top' : 'bottom'; }); }
window.film = { duration: D, frame };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { frame(((performance.now() - t0) / 1000) % D); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
