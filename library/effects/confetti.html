<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
.p{position:absolute;width:1vw;height:1.6vw;border-radius:.2vw}
</style>
</head>
<body>

<script type="module">
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => 1 - Math.pow(1 - clamp01(x), 3);
const easeInOut = (x) => { x = clamp01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const D = 4;
const colors = ['#ff6b6b','#ffd166','#06d6a0','#4cc9f0','#7582ff','#ff9f1c']; const N = 90; const ps = []; for (let i = 0; i < N; i++) { const d = document.createElement('div'); d.className = 'p'; d.style.background = colors[i % colors.length]; document.body.append(d); const r = (k) => ((Math.sin(i * 12.9898 + k * 78.233) * 43758.5453) % 1 + 1) % 1; ps.push({ d, x: r(1) * 100, vx: (r(2) - 0.5) * 30, vy: -40 - r(3) * 50, rot: r(4) * 720, delay: r(5) * 0.4 }); }
function frame(t) { for (const p of ps) { const s = Math.max(0, t - p.delay); const x = p.x + p.vx * s; const y = 105 + p.vy * s + 60 * s * s; p.d.style.left = x + 'vw'; p.d.style.top = y + 'vh'; p.d.style.rotate = (p.rot * s) + 'deg'; p.d.style.opacity = s > 0 ? 1 - clamp01((t - D + 0.6) / 0.6) : 0; } }
window.film = { duration: D, frame };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { frame(((performance.now() - t0) / 1000) % D); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
