<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
.l{position:absolute;border-radius:50%;filter:blur(6vw);mix-blend-mode:screen}
</style>
</head>
<body>
<div class="l" id="a" style="width:60vw;height:60vw;background:#ff8a3d"></div><div class="l" id="b" style="width:45vw;height:45vw;background:#ff3d81"></div>
<script type="module">
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => 1 - Math.pow(1 - clamp01(x), 3);
const easeInOut = (x) => { x = clamp01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const D = 6;
function frame(t) { const a = document.getElementById('a'), b = document.getElementById('b'); a.style.left = (-30 + 30 * Math.sin(t * 0.7)) + 'vw'; a.style.top = (-20 + 15 * Math.cos(t * 0.5)) + 'vw'; a.style.opacity = 0.35 + 0.25 * Math.sin(t * 1.3); b.style.right = (-20 + 20 * Math.cos(t * 0.6)) + 'vw'; b.style.bottom = (-25 + 10 * Math.sin(t * 0.9)) + 'vw'; b.style.opacity = 0.3 + 0.2 * Math.cos(t * 1.1); }
window.film = { duration: D, frame };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { frame(((performance.now() - t0) / 1000) % D); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
