<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
#b{position:absolute;left:50%;bottom:8vh;translate:-50% 0;background:#000b;color:#fff;font-size:2.4vw;padding:.6vw 1.8vw;border-radius:.6vw;white-space:nowrap}
</style>
</head>
<body>
<div id="b">这里是一句字幕</div>
<script type="module">
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => 1 - Math.pow(1 - clamp01(x), 3);
const easeInOut = (x) => { x = clamp01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const D = 3;
function frame(t) { const o = Math.min(ease(t / 0.2), 1 - ease((t - (D - 0.2)) / 0.2)); document.getElementById('b').style.opacity = o; }
window.film = { duration: D, frame };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { frame(((performance.now() - t0) / 1000) % D); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
