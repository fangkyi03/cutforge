<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
body{display:grid;place-items:center;background:#f4efe6;color:#171512}#w{width:70vw}#q{font:700 4.2vw/1.35 "Songti SC","Noto Serif CJK SC",Georgia,serif}#a{margin-top:2vw;font-size:1.8vw;color:#8a8275}#m{font:900 14vw/1 Georgia,serif;color:#c8402f;height:7vw}
</style>
</head>
<body>
<div id="w"><div id="m">“</div><div id="q">把一句话写在这里，它会逐字出现。</div><div id="a">—— 署名</div></div>
<script type="module">
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => 1 - Math.pow(1 - clamp01(x), 3);
const easeInOut = (x) => { x = clamp01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const D = 5;
const q = document.getElementById('q'); const text = q.textContent; function frame(t) { const n = Math.floor(clamp01((t - 0.3) / 2.2) * [...text].length); q.textContent = [...text].slice(0, n).join(''); document.getElementById('a').style.opacity = ease((t - 2.6) / 0.6); document.getElementById('m').style.opacity = ease(t / 0.4); }
window.film = { duration: D, frame };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { frame(((performance.now() - t0) / 1000) % D); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
