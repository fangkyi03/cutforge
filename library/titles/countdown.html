<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
body{display:grid;place-items:center;background:#0e1016;color:#fff}#n{font-size:22vw;font-weight:800;font-variant-numeric:tabular-nums}svg{position:absolute;width:40vw;height:40vw}
</style>
</head>
<body>
<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#ffffff22" stroke-width="2"/><circle id="arc" cx="50" cy="50" r="46" fill="none" stroke="#5865f2" stroke-width="2" stroke-dasharray="289" transform="rotate(-90 50 50)"/></svg><div id="n">3</div>
<script type="module">
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => 1 - Math.pow(1 - clamp01(x), 3);
const easeInOut = (x) => { x = clamp01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const D = 3;
function frame(t) { const n = Math.max(1, 3 - Math.floor(t)); document.getElementById('n').textContent = n; const f = t % 1; document.getElementById('n').style.scale = String(1.15 - 0.15 * ease(f / 0.3)); document.getElementById('arc').style.strokeDashoffset = String(289 * f); }
window.film = { duration: D, frame };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { frame(((performance.now() - t0) / 1000) % D); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
