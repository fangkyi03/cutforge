<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
#w{position:absolute;left:6vw;bottom:9vh;display:flex;flex-direction:column;gap:.6vw}#n{background:#5865f2;color:#fff;font-size:2.6vw;font-weight:700;padding:.6vw 1.6vw;align-self:flex-start}#r{background:#fff;color:#1c2028;font-size:1.6vw;padding:.45vw 1.6vw;align-self:flex-start}
</style>
</head>
<body>
<div id="w"><div id="n">姓名</div><div id="r">身份 · 头衔</div></div>
<script type="module">
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => 1 - Math.pow(1 - clamp01(x), 3);
const easeInOut = (x) => { x = clamp01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const D = 4;
function frame(t) { const a = ease(t / 0.5), b = ease((t - 0.15) / 0.5), o = 1 - ease((t - (D - 0.4)) / 0.4); for (const [id, k] of [['n', a], ['r', b]]) { const e = document.getElementById(id); e.style.clipPath = `inset(0 ${(1 - k) * 100}% 0 0)`; e.style.opacity = o; } }
window.film = { duration: D, frame };
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { frame(((performance.now() - t0) / 1000) % D); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
