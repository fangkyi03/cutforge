<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1016; }
  body { display: grid; place-items: center; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  #glow { position: absolute; width: 70vw; height: 70vw; border-radius: 50%; background: radial-gradient(closest-side, #3b5bdb55, transparent); }
  #wrap { position: relative; text-align: center; color: #f3f5fa; }
  h1 { margin: 0; font-size: 9vw; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  h1 span { display: inline-block; }
  p { margin: 2.2vw 0 0; font-size: 2.3vw; color: #9aa6c2; letter-spacing: 0.06em; }
  #bar { margin: 2.6vw auto 0; height: 0.45vw; width: 22vw; border-radius: 1vw; background: #5c7cfa; transform-origin: 50% 50%; }
</style>
</head>
<body>
<div id="glow"></div>
<div id="wrap">
  <h1 id="title"></h1>
  <div id="bar"></div>
  <p id="sub">把这句话换成你的第一个镜头</p>
</div>
<script type="module">
const TITLE = '新影片';
const title = document.getElementById('title');
title.innerHTML = [...TITLE].map((ch) => `<span>${ch}</span>`).join('');
const letters = [...title.children];
const glow = document.getElementById('glow');
const bar = document.getElementById('bar');
const sub = document.getElementById('sub');

const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => 1 - Math.pow(1 - clamp01(x), 3);

window.film = {
  duration: 5,
  ready: document.fonts.ready,
  // 同一个 t 永远画出同一幅画面：所有状态都从 t 算出来
  frame(t) {
    letters.forEach((el, i) => {
      const k = ease((t - 0.25 - i * 0.09) / 0.7);
      el.style.opacity = k;
      el.style.translate = `0 ${(1 - k) * 0.6}em`;
    });
    bar.style.scale = `${ease((t - 0.9) / 0.8)} 1`;
    const s = ease((t - 1.3) / 0.8);
    sub.style.opacity = s;
    sub.style.translate = `0 ${(1 - s) * 1.2}vw`;
    glow.style.scale = String(0.9 + 0.12 * Math.sin(t * 0.9));
    glow.style.translate = `${Math.sin(t * 0.5) * 4}vw ${Math.cos(t * 0.4) * 3}vw`;
  },
};

// 没有宿主时（直接在浏览器里打开这个文件）自己播放
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => {
    film.frame(((performance.now() - t0) / 1000) % film.duration);
    requestAnimationFrame(loop);
  };
  loop();
}
</script>
</body>
</html>
