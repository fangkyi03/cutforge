[package]
name = "cutforge"
version = "0.4.0"
description = "让编码智能体做视频、让人随手改的本地 IDE"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
