<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CutForge</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='4' width='20' height='16' rx='4' fill='%235865f2'/%3E%3Cpath d='M10 8.500v7l6-3.500z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/vendor/codemirror/lib/codemirror.css">
<link rel="stylesheet" href="/styles.css">
<script>document.documentElement.dataset.theme = localStorage.getItem('cf.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');</script>
<!--boot-->
</head>
<body>
<header id="top">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="18" height="18"><rect x="2" y="4" width="20" height="16" rx="4" fill="var(--accent)"/><path d="M10 8.500v7l6-3.500z" fill="#fff"/></svg>
    <b>CutForge</b>
  </div>
  <div class="spacer"></div>
  <button id="projBtn" class="ghost" title="在文件管理器里打开工程目录"></button>
  <div class="spacer"></div>
  <div id="status"></div>
  <button id="themeBtn" class="ghost icon" title="切换浅色／深色"></button>
  <button id="versionsBtn" class="ghost" title="存版本、回到旧版本">版本</button>
  <button id="envBtn" class="ghost" title="检查这台电脑的环境，管理智能体">环境</button>
  <button id="lookBtn" class="ghost" title="检查整部影片，结果列在“问题”里">检查</button>
  <button id="exportBtn" class="primary">导出</button>
</header>

<div id="work">
  <aside id="left" class="card">
    <div class="tabs" data-group="left">
      <button data-tab="media" class="on">素材</button>
      <button data-tab="files">文件</button>
      <button data-tab="styles">风格</button>
    </div>
    <section id="media" class="pane"></section>
    <section id="files" class="pane hidden"></section>
    <section id="styles" class="pane hidden"></section>
  </aside>

  <section id="center">
    <div id="editorPane" class="card hidden">
      <div id="edTabs"></div>
      <div id="edBody"></div>
    </div>
    <div class="split split-v hidden" data-split="editor"></div>
    <div id="viewer" class="card">
      <div id="stageWrap"><iframe id="player" allow="autoplay; fullscreen" title="预览"></iframe></div>
      <div id="transport"></div>
    </div>
  </section>

  <aside id="inspector" class="card">
    <div class="card-head"><b>属性</b><div class="spacer"></div><button id="inspClose" class="ghost icon" title="收起"></button></div>
    <section id="props" class="pane"></section>
  </aside>
</div>

<div class="split split-h" data-split="bottom"></div>

<footer id="bottom" class="card">
  <div class="tabs" data-group="bottom">
    <button data-tab="timeline" class="on">时间线</button>
    <button data-tab="problems">问题<i id="probCount"></i></button>
    <button data-tab="output">输出</button>
    <div id="tlLeft"></div>
    <div class="spacer"></div>
    <div id="tlRight"></div>
  </div>
  <section id="timeline" class="pane"></section>
  <section id="problems" class="pane hidden"></section>
  <section id="output" class="pane hidden"><pre id="log"></pre></section>
</footer>

<aside id="chat" class="card"></aside>

<div id="toasts"></div>
<div id="modal" class="hidden"></div>

<script src="/vendor/codemirror/lib/codemirror.js"></script>
<script src="/vendor/codemirror/mode/xml/xml.js"></script>
<script src="/vendor/codemirror/mode/javascript/javascript.js"></script>
<script src="/vendor/codemirror/mode/css/css.js"></script>
<script src="/vendor/codemirror/mode/htmlmixed/htmlmixed.js"></script>
<script src="/vendor/codemirror/mode/markdown/markdown.js"></script>
<script src="/vendor/codemirror/addon/edit/matchbrackets.js"></script>
<script src="/vendor/codemirror/addon/edit/closebrackets.js"></script>
<script src="/vendor/codemirror/addon/edit/closetag.js"></script>
<script src="/vendor/codemirror/addon/fold/xml-fold.js"></script>
<script src="/vendor/codemirror/addon/selection/active-line.js"></script>
<script src="/vendor/codemirror/addon/comment/comment.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
