# 打标签 v* 时构建 Mac（Apple 芯片、Intel）和 Windows 安装包，传到对应的 GitHub Release。
# 也可以在 Actions 页面手动运行，填入要发布的标签。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要上传到的 Release 标签（例如 v0.2.0）
        required: true

permissions:
  contents: write

env:
  NODE_VERSION: 22.23.4

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            node: darwin-arm64
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            node: darwin-x64
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            node: win-x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 放入随包的 Node 运行时
        shell: bash
        run: |
          mkdir -p src-tauri/node
          base="https://nodejs.org/dist/v${NODE_VERSION}"
          if [[ "${{ matrix.node }}" == win-* ]]; then
            curl -fsSL "$base/node-v${NODE_VERSION}-${{ matrix.node }}.zip" -o node.zip
            unzip -q node.zip
            cp "node-v${NODE_VERSION}-${{ matrix.node }}/node.exe" src-tauri/node/node.exe
            cp "node-v${NODE_VERSION}-${{ matrix.node }}/LICENSE" src-tauri/node/LICENSE
          else
            curl -fsSL "$base/node-v${NODE_VERSION}-${{ matrix.node }}.tar.gz" | tar xz
            cp "node-v${NODE_VERSION}-${{ matrix.node }}/bin/node" src-tauri/node/node
            cp "node-v${NODE_VERSION}-${{ matrix.node }}/LICENSE" src-tauri/node/LICENSE
          fi
          ls -la src-tauri/node

      - name: 构建
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: 整理安装包
        shell: bash
        run: |
          mkdir -p out
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) cp "$dir"/dmg/*.dmg "out/CutForge-${version}-mac-apple-silicon.dmg" ;;
            x86_64-apple-darwin)  cp "$dir"/dmg/*.dmg "out/CutForge-${version}-mac-intel.dmg" ;;
            x86_64-pc-windows-msvc) cp "$dir"/nsis/*.exe "out/CutForge-${version}-windows-x64-setup.exe" ;;
          esac
          ls -la out

      - name: 上传到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$tag" out/* --clobber --repo "${{ github.repository }}"
